services:
  - type: web
    name: vericertis-embedding
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRANSFORMERS_CACHE
        value: /opt/render/.cache/huggingface
      - key: HF_HOME
        value: /opt/render/.cache/huggingface
