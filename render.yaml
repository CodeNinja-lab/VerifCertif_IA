services:
  - type: web
    name: veriCertis-backend
    env: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: APP_NAME
        value: VeriCertis
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: veriCertis-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: veriCertis-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: veriCertis-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: veriCertis-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: veriCertis-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: veriCertis-db
          property: connectionString
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: info
      - key: AI_API_URL
        value: https://verifcertif-ia-1.onrender.com
      - key: AI_API_TIMEOUT
        value: 60
      - key: GEMINI_API_KEY
        sync: false
      - key: OFFERS_SYNC_SERVICE_URL
        sync: false
      - key: OFFERS_SYNC_SERVICE_TOKEN
        sync: false
      - key: OFFERS_SYNC_TIMEOUT
        value: 120

databases:
  - name: veriCertis-db
    plan: free
    region: frankfurt
    databaseName: vericertis
    user: vericertis
